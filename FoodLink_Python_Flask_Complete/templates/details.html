{% extends "base.html" %}{% block content %}<section class="detail"><div class="detail-visual">🥘</div><div><span class="tag">{{d.category}}</span><h1>{{d.food}}</h1><p class="lead">{{d.donor}} is offering surplus food in {{d.city}}.</p><div class="detail-grid"><div><b>Quantity</b><span>{{d.quantity}} {{d.unit}}</span></div><div><b>Servings</b><span>{{d.servings}}</span></div><div><b>Food Type</b><span>{{d.type}}</span></div><div><b>Status</b><span>{{d.status}}</span></div><div><b>Location</b><span>{{d.address}}</span></div><div><b>Match</b><span>{{d.score}}%</span></div></div><form method="post" action="{{url_for('request_donation',did=d.id)}}"><button class="cta">Request This Donation →</button></form></div></section>{% endblock %}
