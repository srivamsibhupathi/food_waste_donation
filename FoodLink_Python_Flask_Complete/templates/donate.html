{% extends "base.html" %}{% block title %}Donate Food — FoodLink{% endblock %}{% block content %}
<section class="page-head"><span class="eyebrow">FOOD DONATION</span><h1>Share your surplus.</h1><p>Tell us what you have and we'll help it reach the right community.</p></section>
<form class="form-card" method="post" enctype="multipart/form-data" autocomplete="off"><div class="form-section"><h2>Donor information</h2><div class="form-grid"><label>Donor Name<input name="donor_name" required placeholder="Your name"></label><label>Organization Name<input name="organization" placeholder="Restaurant / Hotel / Organization"></label><label>Contact Number<input name="phone" required placeholder="+91 98765 43210"></label></div></div>
<div class="form-section"><h2>Food details</h2><div class="form-grid"><label>Food Name<input name="food_name" required placeholder="e.g. Vegetable Biryani"></label><label>Food Category<select name="category" required><option>Cooked Meals</option><option>Rice</option><option>Vegetables</option><option>Bakery</option><option>Fruits</option><option>Packaged Food</option><option>Dairy</option><option>Other</option></select></label><label>Food Type<select name="food_type"><option>Vegetarian</option><option>Non-Vegetarian</option><option>Vegan</option></select></label><label>Quantity<input type="number" step="0.1" name="quantity" min="0" required autocomplete="off" placeholder="Enter quantity"></label><label>Unit<select name="unit"><option>kg</option><option>litre</option><option>packets</option><option>boxes</option></select></label><label>Number of Servings<input type="number" name="servings" min="0" required autocomplete="off" placeholder="Enter servings"></label><label>Preparation Date<input type="date" name="prep_date"></label><label>Best Before / Expiry<input type="datetime-local" name="expiry"></label></div></div>
<div class="form-section"><h2>Pickup information</h2><div class="form-grid"><label class="wide">Pickup Address<textarea name="address" required placeholder="Full pickup address"></textarea></label><label>City<input name="city" required autocomplete="off" placeholder="Enter city"></label><label>Special Instructions<textarea name="instructions" placeholder="Allergy notes, packing instructions..."></textarea></label><label>Food Image<input type="file" name="food_image" accept="image/*"></label></div></div>
<button class="cta" type="submit">List My Donation →</button></form>{% endblock %}
